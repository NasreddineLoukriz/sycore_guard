name: sycore_guard
description: "SYcore Guard — an offline voice privacy guard that runs STT, an on-device LLM and TTS entirely on the device."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # On-device AI runtime (LLM + speech backends).
  flutter_edge_ai: ^2.5.4
  flutter_edge_ai_litertlm: ^1.19.0
  flutter_edge_ai_speech: ^0.5.12

  # Audio capture, playback and permissions.
  just_audio: ^0.10.6
  record: ^7.1.2
  permission_handler: ^11.3.1
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    # Whisper-tiny (STT) + its tokenizer.
    - assets/models/stt/
    # Qwen3-0.6B (guard LLM).
    - assets/models/llm/
    # Matcha (TTS) bundle: every manifest file the installer expects.
    - assets/models/tts/
